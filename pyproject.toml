[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthos-open"
version = "0.5.0.dev0"
description = "Goal-driven, consent-aware wellness planning with pluggable wearable data and delivery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]
license = {file = "LICENSE"}
authors = [{name = "Ren Zheng (任正)", email = "1626952981@qq.com"}]
keywords = [
  "wearables", "health-data", "fitbit", "local-first", "privacy",
  "quantified-self", "personal-health-record", "consent", "digital-health",
  "hrv", "sleep", "resting-heart-rate", "self-hosted",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Intended Audience :: Healthcare Industry",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/producer1218-code/healthos-open"
Source = "https://github.com/producer1218-code/healthos-open"
Issues = "https://github.com/producer1218-code/healthos-open/issues"
Releases = "https://github.com/producer1218-code/healthos-open/releases"

[project.scripts]
healthos = "healthos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
healthos = ["device_catalog.json", "ui.html"]
